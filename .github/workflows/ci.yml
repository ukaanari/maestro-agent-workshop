# Offline validation on a GitHub-hosted macOS 26 arm64 runner.
# No secrets, model credentials, network services or live agent sessions are used:
# the suite runs deterministic fake agents under the real Seatbelt sandbox.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macos-26 arm64 / ${{ matrix.python.name }}
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python:
          # Interpreters outside the home directory; hosted tool-cache Pythons
          # live under the runner's home and are refused by the sandbox policy.
          # known_failures: file of exact test/subTest ids allowed to fail (each tracked
          # in an issue). Any other failure, or a listed id that passes, fails the job.
          - name: Xcode Python (supported)
            path: /usr/bin/python3
            known_failures: ""
          - name: "Homebrew Python 3.15 (experimental, known failures #7)"
            path: /opt/homebrew/bin/python3
            known_failures: .github/known-failures/homebrew-python-3.15.txt
    env:
      PY: ${{ matrix.python.path }}
      KNOWN_FAILURES: ${{ matrix.python.known_failures }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Host details
        run: |
          sw_vers
          uname -m
          csrutil status || true
          "$PY" --version
          umask
          /usr/bin/git --version

      - name: Prerequisite check (maestro doctor)
        run: '"$PY" -B maestro.py doctor'

      - name: Test suite (full; only the listed known failures may fail)
        run: '"$PY" -B .github/scripts/check_suite.py --known-failures "$KNOWN_FAILURES"'

      - name: End-to-end demo
        if: ${{ !cancelled() }}
        run: '"$PY" -B examples/demo.py'

      # Read-only evidence for investigating failures: which operations the
      # kernel sandbox denied to Python during this job (pids stripped,
      # counted). Expected denials from self-tests and canary probes are omitted.
      - name: Sandbox denials (diagnostics)
        if: ${{ failure() }}
        run: |
          /usr/bin/log show --last 15m --style compact --predicate 'sender == "Sandbox"' 2>/dev/null \
            | grep -iE 'Sandbox: [^ ]*python[^ ]*\([0-9]+\) deny\(' \
            | grep -vE 'maestro-(sandbox-probe|p1a-tests)-|kern\.procargs2\.' \
            | sed -E 's/^.*Sandbox: //; s/\([0-9]+\)//g' | sort | uniq -c | sort -rn | head -150 || true

  # Offline privacy guard: high-confidence secrets, personal identifiers and forbidden
  # paths in tracked files and in the commits this push or pull request adds. It runs
  # after the push, so it cannot un-publish a value; the local hooks and GitHub push
  # protection act earlier. See CONTRIBUTING.md.
  privacy:
    name: privacy guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tracked files
        run: python3 -B .github/scripts/privacy_scan.py tracked

      - name: New commits (content, messages, author and committer emails)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && ! printf '%s' "$BASE" | grep -qE '^0+$' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 -B .github/scripts/privacy_scan.py commits "$BASE..$TIP"
          else
            echo "No base commit to compare; the tracked-file scan above still applies."
          fi
